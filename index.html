<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב אימונים אישי - עמית</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.95); box-shadow: 0 4px 15px rgba(0,0,0,0.03); border-radius: 1rem; }
        .app-gradient { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
        .no-select { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- הגדרות Firebase הקיים שלך ---
        const firebaseConfig = {
            apiKey: "AIzaSyCDIQc5vKjMDVAao47PoapqdowILgJEbvE",
            authDomain: "iec--weektable.firebaseapp.com",
            projectId: "iec--weektable",
            storageBucket: "iec--weektable.firebasestorage.app",
            messagingSenderId: "298924086909",
            appId: "1:298924086909:web:be1e52a5d1f2ca4cdbc314"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        // שימוש באוסף חדש לחלוטין כדי לא להתנגש עם סידור העבודה
        const docRef = db.collection('sports_tracker').doc('amit_weekly');

        const { useState, useEffect, useRef } = React;

        const DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
        
        const WORKOUTS = {
            'חדר כושר (חזה)': { icon: '🏋️‍♂️', color: 'blue' },
            'חדר כושר (גב)': { icon: '💪', color: 'indigo' },
            'שחייה': { icon: '🏊‍♂️', color: 'cyan' },
            'ריצה': { icon: '🏃‍♂️', color: 'green' },
            'כדורעף': { icon: '🏐', color: 'yellow' },
            'טניס': { icon: '🎾', color: 'lime' },
            'אחר': { icon: '📝', color: 'purple' }
        };

        const generateEmptySchedule = () => {
            let sched = {};
            DAYS.forEach(day => { sched[day] = []; });
            return sched;
        };

        // חישוב מתי היה יום שבת האחרון בשעה 15:00
        const getLastSaturday1500 = () => {
            const now = new Date();
            const d = new Date(now);
            const day = d.getDay(); // 0=Sun, 6=Sat
            let daysToSubtract = day - 6; 
            if (daysToSubtract < 0) daysToSubtract += 7; 
            
            // אם היום שבת אבל לפני 15:00, מתייחסים לשבת שעברה
            if (daysToSubtract === 0 && now.getHours() < 15) {
                daysToSubtract = 7;
            }
            d.setDate(d.getDate() - daysToSubtract);
            d.setHours(15, 0, 0, 0);
            return d.getTime();
        };

        const getNextSaturday1500 = () => {
            const now = new Date();
            const d = new Date(now);
            const day = d.getDay();
            let daysToAdd = 6 - day;
            if (daysToAdd < 0 || (daysToAdd === 0 && now.getHours() >= 15)) {
                daysToAdd += 7;
            }
            d.setDate(d.getDate() + daysToAdd);
            d.setHours(15, 0, 0, 0);
            return d;
        };

        function App() {
            const [schedule, setSchedule] = useState(generateEmptySchedule());
            const [coachNotes, setCoachNotes] = useState("");
            const [isSavingNotes, setIsSavingNotes] = useState(false);
            const [lastUpdated, setLastUpdated] = useState("");
            const [isLoading, setIsLoading] = useState(true);
            const notesTimeout = useRef(null);

            useEffect(() => {
                const unsubscribe = docRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        const lastSat1500 = getLastSaturday1500();
                        const dbLastReset = data.lastReset || 0;

                        if (lastSat1500 > dbLastReset) {
                            performWeeklyReset();
                        } else {
                            setSchedule(data.schedule || generateEmptySchedule());
                            if (data.coachNotes !== undefined && document.activeElement.id !== 'coach-notes') {
                                setCoachNotes(data.coachNotes);
                            }
                            setLastUpdated(data.lastUpdated || "");
                            setIsLoading(false);
                        }
                    } else {
                        docRef.set({
                            schedule: generateEmptySchedule(),
                            coachNotes: "",
                            lastUpdated: "",
                            lastReset: Date.now()
                        });
                    }
                }, (error) => {
                    console.error("שגיאת התחברות:", error);
                });

                return () => unsubscribe();
            }, []);

            const performWeeklyReset = () => {
                const empty = generateEmptySchedule();
                docRef.update({
                    schedule: empty,
                    coachNotes: "",
                    lastUpdated: "🔄 המערכת אופסה אוטומטית לקראת שבוע חדש",
                    lastReset: Date.now()
                });
            };

            const updateCloud = (newSchedule, notesStr = coachNotes) => {
                const now = new Date();
                const stamp = `עודכן לאחרונה: ${now.toLocaleDateString('he-IL')} ב-${now.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'})}`;
                
                docRef.update({
                    schedule: newSchedule,
                    coachNotes: notesStr,
                    lastUpdated: stamp
                }).catch(err => alert("שגיאה בשמירה לענן."));
            };

            const handleWorkoutToggle = (day, workoutName) => {
                let dayWorkouts = [...schedule[day]];
                let newSchedule = { ...schedule };
                
                // הסרה אם כבר קיים
                if (dayWorkouts.includes(workoutName)) {
                    dayWorkouts = dayWorkouts.filter(w => w !== workoutName);
                } 
                // טיפול בתוספת של אימון "אחר" חופשי
                else if (workoutName === 'אחר') {
                    const reason = window.prompt("פרט איזה אימון (למשל: ספרינטים, פאדל ערב, יוגה):");
                    if (reason && reason.trim() !== '') {
                        dayWorkouts.push(`אחר: ${reason.trim()}`);
                    }
                } 
                // בחירה רגילה
                else {
                    dayWorkouts.push(workoutName);
                }
                
                newSchedule[day] = dayWorkouts;
                setSchedule(newSchedule);
                updateCloud(newSchedule);
            };

            // שמירה אוטומטית להערות המאמן בעת הקלדה ממושכת או עזיבת התיבה
            const handleNotesChange = (e) => {
                const val = e.target.value;
                setCoachNotes(val);
                setIsSavingNotes(true);
                
                if (notesTimeout.current) clearTimeout(notesTimeout.current);
                notesTimeout.current = setTimeout(() => {
                    updateCloud(schedule, val);
                    setIsSavingNotes(false);
                }, 1000);
            };

            const getWorkoutStyle = (workoutName, isSelected = false) => {
                const baseName = workoutName.startsWith('אחר:') ? 'אחר' : workoutName;
                const color = WORKOUTS[baseName] ? WORKOUTS[baseName].color : 'gray';
                
                const styles = {
                    'blue': isSelected ? 'bg-blue-500 text-white border-blue-600' : 'bg-blue-50 text-blue-700 border-blue-200 hover:bg-blue-100',
                    'indigo': isSelected ? 'bg-indigo-500 text-white border-indigo-600' : 'bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100',
                    'cyan': isSelected ? 'bg-cyan-500 text-white border-cyan-600' : 'bg-cyan-50 text-cyan-700 border-cyan-200 hover:bg-cyan-100',
                    'green': isSelected ? 'bg-green-500 text-white border-green-600' : 'bg-green-50 text-green-700 border-green-200 hover:bg-green-100',
                    'yellow': isSelected ? 'bg-yellow-500 text-white border-yellow-600' : 'bg-yellow-50 text-yellow-700 border-yellow-200 hover:bg-yellow-100',
                    'lime': isSelected ? 'bg-lime-500 text-white border-lime-600' : 'bg-lime-50 text-lime-700 border-lime-200 hover:bg-lime-100',
                    'purple': isSelected ? 'bg-purple-500 text-white border-purple-600' : 'bg-purple-50 text-purple-700 border-purple-200 hover:bg-purple-100'
                };
                return styles[color] || styles['blue'];
            };

            const getIcon = (workoutName) => {
                const baseName = workoutName.startsWith('אחר:') ? 'אחר' : workoutName;
                return WORKOUTS[baseName] ? WORKOUTS[baseName].icon : '📌';
            };

            if (isLoading) {
                return (
                    <div className="flex justify-center items-center h-screen bg-gray-50">
                        <div className="text-xl font-bold text-orange-600 animate-pulse">טוען נתוני אימונים... 🏋️‍♂️</div>
                    </div>
                );
            }

            const nextResetDate = getNextSaturday1500();
            const nextResetStr = `שבת, ${nextResetDate.getDate()}/${nextResetDate.getMonth() + 1} בשעה 15:00`;

            return (
                <div className="max-w-5xl mx-auto p-4 pb-20 no-select">
                    
                    <header className="app-gradient text-white p-6 rounded-2xl shadow-lg mb-4 text-center relative overflow-hidden">
                        <h1 className="text-3xl font-black mb-2 relative z-10">תכנון אימונים אישי</h1>
                        <p className="text-orange-100 text-lg font-medium relative z-10">עמית - מעקב שבועי 🏃‍♂️</p>
                    </header>

                    <div className="text-center mb-8 flex flex-col sm:flex-row justify-center items-center gap-3">
                        <span className="inline-block bg-white border border-gray-200 text-gray-600 text-sm font-bold px-4 py-2 rounded-full shadow-sm">
                            ⏳ איפוס המערכת: {nextResetStr}
                        </span>
                        {lastUpdated && (
                            <span className="inline-block bg-gray-100 text-gray-500 text-xs px-3 py-2 rounded-full">
                                {lastUpdated}
                            </span>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-7 gap-4 mb-8">
                        {DAYS.map(day => (
                            <div key={day} className="glass-card bg-white p-4 border border-gray-200 flex flex-col h-full hover:shadow-md transition-shadow">
                                <h3 className="text-lg font-black text-gray-800 border-b-2 border-orange-100 pb-2 mb-4 text-center">{day}</h3>
                                
                                <div className="flex flex-col gap-2 flex-1">
                                    {/* הצגת אימונים קיימים שנבחרו (כולל הזנות טקסט חופשי של "אחר") */}
                                    {schedule[day].map(selectedWorkout => (
                                        <button
                                            key={selectedWorkout}
                                            onClick={() => handleWorkoutToggle(day, selectedWorkout)}
                                            className={`p-2 rounded-lg font-bold text-sm border-2 text-right flex justify-between items-center transition-colors ${getWorkoutStyle(selectedWorkout, true)}`}
                                            title="לחץ כדי להסיר"
                                        >
                                            <span className="truncate flex-1">{selectedWorkout}</span>
                                            <span>{getIcon(selectedWorkout)}</span>
                                        </button>
                                    ))}

                                    {/* אופציות לבחירה */}
                                    <div className="mt-auto pt-4 border-t border-gray-100 flex flex-wrap gap-1.5 justify-center">
                                        {Object.keys(WORKOUTS).map(workout => {
                                            // אם האימון נבחר במדויק מתוך הרשימה הסגורה (לא חל על "אחר" חופשי)
                                            if (schedule[day].includes(workout) && workout !== 'אחר') return null;
                                            
                                            return (
                                                <button
                                                    key={workout}
                                                    onClick={() => handleWorkoutToggle(day, workout)}
                                                    className={`px-2 py-1.5 rounded border text-xs font-bold transition-colors ${getWorkoutStyle(workout, false)}`}
                                                    title={`הוסף ${workout}`}
                                                >
                                                    {WORKOUTS[workout].icon} {workout === 'אחר' ? 'הוסף חריג' : workout.split(' ')[0]}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* אזור המאמן */}
                    <div className="glass-card p-6 border border-gray-200 bg-white">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                                <span>📋</span> סיכום שבועי - אזור המאמן
                            </h2>
                            {isSavingNotes && <span className="text-xs bg-orange-100 text-orange-700 px-2 py-1 rounded font-bold">שומר...</span>}
                        </div>
                        <p className="text-sm text-gray-500 mb-4">
                            המאמן יכול לכתוב כאן דגשים ומסקנות מהשבוע החולף. הנתונים נשמרים אוטומטית ויאופסו יחד עם הלו"ז בכל שבת.
                        </p>
                        <textarea
                            id="coach-notes"
                            value={coachNotes}
                            onChange={handleNotesChange}
                            onBlur={() => updateCloud(schedule, coachNotes)}
                            placeholder="הקלד כאן את הדגשים לאימונים, מסקנות או הערות לשיפור..."
                            className="w-full h-32 p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none resize-none transition-all text-gray-700"
                        />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
