<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב אימונים אישי - עמית</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        .app-gradient { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
        .no-select { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        
        .select-custom { 
            appearance: none; 
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); 
            background-repeat: no-repeat; 
            background-position: left 0.5rem center; 
            background-size: 1em; 
        }
        
        .calendar-scroll::-webkit-scrollbar { height: 6px; }
        .calendar-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyCDIQc5vKjMDVAao47PoapqdowILgJEbvE",
            authDomain: "iec--weektable.firebaseapp.com",
            projectId: "iec--weektable",
            storageBucket: "iec--weektable.firebasestorage.app",
            messagingSenderId: "298924086909",
            appId: "1:298924086909:web:be1e52a5d1f2ca4cdbc314"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const docRef = db.collection('sports_tracker').doc('amit_weekly');

        const { useState, useEffect } = React;

        const DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
        
        const WORKOUTS = {
            'מנוחה': { icon: '🛋️', color: 'gray' },
            'חדר כושר (חזה)': { icon: '🏋️‍♂️', color: 'blue' },
            'חדר כושר (גב)': { icon: '💪', color: 'indigo' },
            'שחייה': { icon: '🏊‍♂️', color: 'cyan' },
            'ריצה': { icon: '🏃‍♂️', color: 'green' },
            'כדורעף': { icon: '🏐', color: 'yellow' },
            'טניס': { icon: '🎾', color: 'lime' },
            'אחר': { icon: '📝', color: 'purple' }
        };

        const generateEmptySchedule = () => {
            let sched = {};
            DAYS.forEach(day => { sched[day] = ['']; });
            return sched;
        };

        const getLastSaturday1500 = () => {
            const now = new Date();
            const d = new Date(now);
            const day = d.getDay(); 
            let daysToSubtract = day - 6; 
            if (daysToSubtract < 0) daysToSubtract += 7; 
            
            if (daysToSubtract === 0 && now.getHours() < 15) {
                daysToSubtract = 7;
            }
            d.setDate(d.getDate() - daysToSubtract);
            d.setHours(15, 0, 0, 0);
            return d.getTime();
        };

        // הפונקציה שהייתה חסרה! מחשבת מתי שבת הבאה כדי להציג במסך
        const getNextSaturday1500 = () => {
            const now = new Date();
            const d = new Date(now);
            const day = d.getDay();
            let daysToAdd = 6 - day;
            if (daysToAdd < 0 || (daysToAdd === 0 && now.getHours() >= 15)) {
                daysToAdd += 7;
            }
            d.setDate(d.getDate() + daysToAdd);
            d.setHours(15, 0, 0, 0);
            return d;
        };

        const getWeekDates = (lastSatTime) => {
            const dates = {};
            const baseDate = new Date(lastSatTime);
            DAYS.forEach((day, index) => {
                const currentDate = new Date(baseDate);
                currentDate.setDate(baseDate.getDate() + index + 1); 
                dates[day] = `${currentDate.getDate()}/${currentDate.getMonth() + 1}`;
            });
            return dates;
        };

        function App() {
            const [schedule, setSchedule] = useState(generateEmptySchedule());
            const [notesLog, setNotesLog] = useState([]); // מערך של עדכוני מאמן
            const [currentNote, setCurrentNote] = useState(""); // הטקסט שמוקלד כרגע
            const [lastUpdated, setLastUpdated] = useState("");
            const [isLoading, setIsLoading] = useState(true);
            const [weekDates, setWeekDates] = useState({});

            useEffect(() => {
                const unsubscribe = docRef.onSnapshot((doc) => {
                    const lastSat1500 = getLastSaturday1500();
                    setWeekDates(getWeekDates(lastSat1500));

                    if (doc.exists) {
                        const data = doc.data();
                        const dbLastReset = data.lastReset || 0;

                        if (lastSat1500 > dbLastReset) {
                            performWeeklyReset();
                        } else {
                            const loadedSchedule = data.schedule || generateEmptySchedule();
                            DAYS.forEach(day => {
                                if (!loadedSchedule[day] || loadedSchedule[day].length === 0) {
                                    loadedSchedule[day] = [''];
                                }
                            });
                            
                            setSchedule(loadedSchedule);
                            setNotesLog(data.notesLog || []);
                            setLastUpdated(data.lastUpdated || "");
                            setIsLoading(false);
                        }
                    } else {
                        docRef.set({
                            schedule: generateEmptySchedule(),
                            notesLog: [],
                            lastUpdated: "",
                            lastReset: Date.now()
                        });
                        setIsLoading(false);
                    }
                }, (error) => console.error("שגיאת התחברות:", error));

                return () => unsubscribe();
            }, []);

            const performWeeklyReset = () => {
                const empty = generateEmptySchedule();
                docRef.update({
                    schedule: empty,
                    notesLog: [],
                    lastUpdated: "🔄 המערכת אופסה אוטומטית לקראת שבוע חדש",
                    lastReset: Date.now()
                });
            };

            const updateCloudSchedule = (newSchedule) => {
                const now = new Date();
                const stamp = `הלו"ז עודכן לאחרונה: ${now.toLocaleDateString('he-IL')} ב-${now.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'})}`;
                
                docRef.update({
                    schedule: newSchedule,
                    lastUpdated: stamp
                }).catch(err => console.error("שגיאה בשמירה לענן."));
            };

            const handleAddNote = () => {
                if (!currentNote.trim()) return;
                
                const now = new Date();
                const stamp = `${now.toLocaleDateString('he-IL')} בשעה ${now.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'})}`;
                
                const newNoteObj = {
                    id: Date.now(),
                    text: currentNote.trim(),
                    date: stamp
                };
                
                const newLog = [newNoteObj, ...notesLog];
                setNotesLog(newLog);
                setCurrentNote(""); 
                
                docRef.update({
                    notesLog: newLog,
                    lastUpdated: `עדכון מאמן התווסף ב: ${stamp}`
                }).catch(err => console.error("שגיאה בשמירת הערה לענן."));
            };

            const handleDeleteNote = (id) => {
                if(window.confirm("למחוק את העדכון הזה?")) {
                    const newLog = notesLog.filter(n => n.id !== id);
                    setNotesLog(newLog);
                    docRef.update({ notesLog: newLog });
                }
            };

            const addWorkoutSlot = (day) => {
                const newSchedule = { ...schedule };
                newSchedule[day] = [...newSchedule[day], ''];
                setSchedule(newSchedule);
                updateCloudSchedule(newSchedule);
            };

            const removeWorkoutSlot = (day, index) => {
                const newSchedule = { ...schedule };
                newSchedule[day].splice(index, 1);
                if (newSchedule[day].length === 0) {
                    newSchedule[day].push('');
                }
                setSchedule(newSchedule);
                updateCloudSchedule(newSchedule);
            };

            const handleWorkoutChange = (day, index, newValue) => {
                const newSchedule = { ...schedule };
                
                if (newValue === 'אחר') {
                    const reason = window.prompt("פרט איזה אימון (למשל: ספרינטים, פאדל):");
                    if (reason && reason.trim() !== '') {
                        newSchedule[day][index] = `אחר: ${reason.trim()}`;
                    } else {
                        return; 
                    }
                } else {
                    newSchedule[day][index] = newValue;
                }
                
                setSchedule(newSchedule);
                updateCloudSchedule(newSchedule);
            };

            const getBaseColor = (workoutName) => {
                if (!workoutName) return '';
                const baseName = workoutName.startsWith('אחר:') ? 'אחר' : workoutName;
                return WORKOUTS[baseName] ? WORKOUTS[baseName].color : '';
            };

            if (isLoading) {
                return (
                    <div className="flex justify-center items-center h-screen bg-gray-50">
                        <div className="text-xl font-bold text-orange-600 animate-pulse">טוען יומן אימונים... 🗓️</div>
                    </div>
                );
            }

            const nextResetDate = getNextSaturday1500();
            const nextResetStr = `שבת, ${nextResetDate.getDate()}/${nextResetDate.getMonth() + 1} ב-15:00`;

            return (
                <div className="max-w-7xl mx-auto p-4 pb-20 no-select">
                    
                    <header className="app-gradient text-white p-6 rounded-xl shadow mb-6 text-center relative overflow-hidden">
                        <h1 className="text-2xl font-black mb-1">יומן אימונים אישי</h1>
                        <p className="text-orange-100 text-sm font-medium">עמית | תצוגה שבועית</p>
                    </header>

                    {lastUpdated && (
                        <div className="text-center mb-6">
                            <span className="inline-block bg-gray-200 text-gray-600 text-xs font-bold px-3 py-1.5 rounded-full shadow-sm">
                                {lastUpdated}
                            </span>
                        </div>
                    )}

                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-8">
                        <div className="flex flex-col md:flex-row calendar-scroll md:overflow-x-visible">
                            {DAYS.map((day, i) => (
                                <div key={day} className={`flex-1 flex flex-col min-w-[140px] p-3 ${i !== 0 ? 'border-t md:border-t-0 md:border-r border-gray-100' : ''}`}>
                                    
                                    <div className="text-center mb-4 flex flex-col items-center">
                                        <span className="text-gray-400 text-xs font-bold uppercase tracking-wider">{day}</span>
                                        <span className="text-2xl font-black text-gray-800 mt-1">{weekDates[day]}</span>
                                    </div>
                                    
                                    <div className="flex flex-col gap-2 flex-1">
                                        {schedule[day].map((workout, index) => {
                                            const isOther = workout && workout.startsWith('אחר:');
                                            const selectValue = isOther ? 'אחר' : (workout || '');
                                            const color = getBaseColor(workout);
                                            
                                            const bgClasses = {
                                                '': 'bg-gray-50 border-gray-200 text-gray-500 border-dashed hover:border-solid hover:border-gray-300',
                                                'gray': 'bg-gray-100 border-gray-300 text-gray-700',
                                                'blue': 'bg-blue-100 border-blue-300 text-blue-900',
                                                'indigo': 'bg-indigo-100 border-indigo-300 text-indigo-900',
                                                'cyan': 'bg-cyan-100 border-cyan-300 text-cyan-900',
                                                'green': 'bg-green-100 border-green-300 text-green-900',
                                                'yellow': 'bg-yellow-100 border-yellow-300 text-yellow-900',
                                                'lime': 'bg-lime-100 border-lime-300 text-lime-900',
                                                'purple': 'bg-purple-100 border-purple-300 text-purple-900'
                                            };
                                            const currentBg = bgClasses[color] || bgClasses[''];

                                            return (
                                                <div key={index} className="flex flex-col group relative">
                                                    <div className="flex items-center gap-1">
                                                        <select 
                                                            value={selectValue}
                                                            onChange={(e) => handleWorkoutChange(day, index, e.target.value)}
                                                            className={`select-custom w-full p-2 pl-6 pr-2 border rounded-lg font-bold text-[13px] outline-none transition-all cursor-pointer ${currentBg}`}
                                                        >
                                                            <option value="" disabled>בחר אימון...</option>
                                                            {Object.keys(WORKOUTS).map(wName => (
                                                                <option key={wName} value={wName}>
                                                                    {WORKOUTS[wName].icon} {wName}
                                                                </option>
                                                            ))}
                                                        </select>
                                                        {workout && (
                                                            <button 
                                                                onClick={() => removeWorkoutSlot(day, index)}
                                                                className="text-gray-300 hover:text-red-500 transition-colors p-1"
                                                                title="מחק אימון"
                                                            >
                                                                ✕
                                                            </button>
                                                        )}
                                                    </div>
                                                    {isOther && (
                                                        <div className="text-[11px] font-medium text-purple-800 bg-purple-50 px-2 py-1 rounded border border-purple-200 mt-1 shadow-sm">
                                                            {workout.replace('אחר: ', '')}
                                                        </div>
                                                    )}
                                                </div>
                                            )
                                        })}
                                        
                                        <button
                                            onClick={() => addWorkoutSlot(day)}
                                            className="mt-1 flex items-center justify-center gap-1 w-full py-1 text-xs font-bold text-gray-400 hover:text-orange-500 hover:bg-orange-50 rounded transition-colors"
                                        >
                                            <span className="text-lg leading-none">+</span> הוסף
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* אזור עדכוני המאמן - מתפקד כיומן (Feed) */}
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                                <span>📋</span> סיכומים והערות מאמן
                            </h2>
                            <span className="text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded">איפוס: {nextResetStr}</span>
                        </div>
                        
                        <div className="mb-6 bg-orange-50/50 p-4 rounded-lg border border-orange-100">
                            <textarea
                                value={currentNote}
                                onChange={(e) => setCurrentNote(e.target.value)}
                                placeholder="המאמן - הקלד כאן סיכום, דגש או הערה חדשה..."
                                className="w-full h-20 p-3 border border-orange-200 bg-white rounded-lg focus:ring-2 focus:ring-orange-400 focus:border-orange-400 outline-none resize-none transition-all text-gray-700 text-sm mb-3"
                            />
                            <div className="text-left">
                                <button 
                                    onClick={handleAddNote}
                                    disabled={!currentNote.trim()}
                                    className="bg-orange-500 text-white px-5 py-2 rounded-lg font-bold text-sm hover:bg-orange-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm"
                                >
                                    💾 הוסף עדכון
                                </button>
                            </div>
                        </div>

                        <div className="flex flex-col gap-3">
                            {notesLog.length === 0 ? (
                                <div className="text-center text-gray-400 text-sm py-4 border-2 border-dashed border-gray-100 rounded-lg">
                                    אין עדיין הערות מהמאמן לשבוע זה.
                                </div>
                            ) : (
                                notesLog.map(note => (
                                    <div key={note.id} className="bg-white border border-gray-200 p-4 rounded-lg shadow-sm relative group hover:border-orange-200 transition-colors">
                                        <div className="flex justify-between items-start mb-2">
                                            <span className="text-xs font-bold text-orange-600 bg-orange-50 px-2 py-1 rounded">
                                                🗓️ {note.date}
                                            </span>
                                            <button 
                                                onClick={() => handleDeleteNote(note.id)}
                                                className="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1"
                                                title="מחק עדכון זה"
                                            >
                                                🗑️
                                            </button>
                                        </div>
                                        <div className="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">
                                            {note.text}
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
